<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kartiki Strategic Capital – Contact</title>
<meta name="description" content="Request a call-back from Kartiki Strategic Capital.">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="contact">
<main>
<section class="ph"><div class="bl a" style="opacity:.3"></div><div class="container"><h1 class="rv">Let's plan <em>together</em></h1><p class="rv" style="--i:1">Tell us what you need and an advisor will call you within one working day.</p></div></section>
<div class="container up"><div class="row g-4">
 <div class="col-lg-7"><div class="bx rv"><form id="f" class="row g-3">
  <div class="col-12"><label class="form-label" for="n">Full name</label><input class="form-control" id="n" name="n" required autocomplete="name"></div>
  <div class="col-md-6"><label class="form-label" for="p">Phone number</label><input class="form-control" id="p" type="tel" required autocomplete="tel"></div>
  <div class="col-md-6"><label class="form-label" for="e">Email</label><input class="form-control" id="e" type="email" autocomplete="email"></div>
  <div class="col-12"><label class="form-label" for="sel">I am interested in</label><select class="form-select" id="sel"></select></div>
  <div class="col-12"><label class="form-label" for="m">Message</label><textarea class="form-control" id="m" rows="3"></textarea></div>
  <div class="col-12"><button class="btn btn-gold" type="submit">Request a call-back</button></div></form>
  <div class="done" id="ok" role="status"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="32"/><path d="M26 41l10 10 19-22"/></svg><h3 id="okt" style="margin-top:14px;font-size:34px"></h3></div></div></div>
 <div class="col-lg-5"><div class="co rv" style="--i:1"><h3>Kartiki Strategic Capital</h3><p><b>Phone</b>+91 00000 00000</p><p><b>Email</b>info@example.com</p><p><b>Office</b>Your office address, City, State</p><p><b>Hours</b>Mon to Sat, 10am to 7pm</p></div></div>
</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
